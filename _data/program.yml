- day: Thursday, 24 September
  id: day4
  date: 2026-09-24
  sessions:
    - name: "Early Morning"
      talks:
        - time: "09:00 - 09:40"
          title: "Minimising the Minimised --- How Much Key Material Do Key-Alternating Ciphers Really Need?"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Ashwin Jha"
          note: "The Even-Mansour construction, and its generalisation to key-alternating ciphers, have long been studied as high-level provable security abstractions of the modern block cipher design philosophy. Starting from the seminal work of Even and Mansour, a substantial line of work has explored how far these constructions can be minimised along different dimensions, including the number of keys, the number of permutations, and the required independence assumptions. Following this line of work, we ask a complementary question: how large do the key spaces themselves need to be? We show that this question has deep connections with additive combinatorics, with different additive notions influencing different keying scenarios. These connections lead to substantially reduced key material while yielding near-optimal information-theoretic security bounds."
