- day: Wednesday, 23 September
  id: day3
  date: 2026-09-23
  sessions:
    - name: "Early Morning"
      talks:
        - time: "09:00 - 09:40"
          title: "Invited Talk"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Bart Mennink"
        - time: "09:50 - 10:30"
          title: "FLOE: Random-Access AEAD for Fast Lightweight Online Encryption"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Julia Len"
          note: "An ubiquitous problem in large-scale production environments is online encryption of large messages (e.g., databases, video streams, etc.), that is, encryption while using a small amount of memory. While straightforward when only (unauthenticated) encryption is required---say, by encrypting/decrypting in chunks, using a standard encryption scheme---this is more challenging in the presence of active attackers, who may drop or reorganize ciphertext segments arbitrarily. Moreover, many use cases additionally require both encryption and decryption to be random access, meaning that messages (resp., ciphertexts) can be encrypted (resp., decrypted) in any order. The purpose of this talk is to present the design of FLOE (Fast Lightweight Online Encryption), a new random-access online AEAD scheme. FLOE was designed in close collaboration with Snowflake, a leading cloud company, where it is slated to be deployed in production to protect sensitive user data. Requiring online encryption of large files, Snowflake encountered a number of real-world challenges with existing schemes, which motivated the design of a new construction."
    - break:
        time: "10:30 - 11:00"
        type: "Coffee break"
        location: "HHEG07 - Foyer"
    - name: "Late Morning"
      talks:
        - time: "11:00 - 11:40"
          title: "Counter Galois Onion (CGO): Fast Non-Malleable Onion Encryption for Tor"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Jean Paul Degabriele"
          note: "In 2012 the Tor project expressed the need to upgrade Tor's onion encryption scheme to protect against tagging attacks and thereby strengthen its end-to-end integrity protection. In 2016 Nick Matthewson described a concrete onion encryption in Tor proposal 261, where each encryption layer is processed by a strongly secure, yet relatively expensive, tweakable wide-block cipher. Shortly after, Ashur, Dunkelman, and Luykx argued that replacing Tor's Counter-mode encryption with an tweakable wide-block cipher would be an overkill and replacing it instead with the RUP-secure AEAD scheme should suffice. Their intuition turned out to be fairly correct, however, translating said intuition into a secure onion encryption scheme for Tor is far from straightforward. In fact, several unsuccesful attempts followed at describing a concrete scheme for Tor in proposal 295.\n\tCurrently, CGO (described in proposal 359) is the main candidate to become the new onion encryption scheme for Tor and it is already being integrated in Arti, Tor's next-generation implementation in Rust, with plans to be deployed in the near future. Proposal 359 does not describe the design rationale of Counter Galois Onion (CGO), but rather refers to our work instead (eprint 2025/583), where we identify the functionality and security desiderata for Tor's onion encryption, and propose CGO, an alternative onion encryption scheme that follows a minimalistic, modular design and includes several improvements over proposals 261 and 295.\n\tIn this talk, we will explain the design rationale behind CGO and the challenges that need to be overcome for successful deployment in the real world. We will concentrate on the technical side, where we discuss how to turn a relatively simple underlying primitive (think wide blockcipher) into a fully-fledged onion encryption scheme, but we will also detail our interactions with Mathewson to ensure that CGO would actually solve the problems the Tor community cares most about. For instance, for Tor latency is key, requiring an efficient onion encryption scheme. In CGO's case, we use as underlying primitive an updatable tweakable split-domain cipher, which is an augmentation of the recently introduced rugged pseudorandom permutation (Degabriele and Karadzic, CRYPTO 2022) that allows for more efficient designs than the tweakable wide-block cipher suggested in proposal 261.\n\tWe will also address the choices behind our concrete instantiation for the updatable tweakable split-domain cipher, called UIV+ and use it to benchmark our full CGO scheme against Tor's existing onion encryption scheme, demonstrating a clear performance gain at the proxy and at exit and entry routers, at the expense of a mild slowdown at intermediate routers. Both CGO and UIV+ are accompanied by formal security proofs that solidify the informal security claims. For this talk, we will concentrate on the informal, intuitive security that is provided by CGO."
      others:
        - time: "11:40 - 12:30"
          type: "Work in Groups"
          location: "Seminarraum FAV EG A/B/C; FAV Hörsaal 2/3"
