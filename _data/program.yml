- day: Tuesday, 22 September
  id: day2
  date: 2026-09-22
  sessions:
    - name: "Early Morning"
      talks:
        - time: "09:00 - 09:40"
          title: "Directions in Advanced Authenticated Encryption"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Kazuhiko Minematsu"
          note: 'In this talk, I will briefly describe my involvement in two advanced forms of authenticated encryption (AE), especially leakage-resilient AE (LRAE) and committing AE (ComAE). Both classes have received great attention from the community. For LRAE, I will discuss two orthogonal approaches, i.e., everything is equally protected and "leveled" implementation, and show research progress on each of them. For ComAE, I will discuss an issue that arises when composing a black-box AE and a transform to make the transformed AE committing.'
        - time: "09:50 - 10:30"
          title: "An alternative to the H-coefficient technique for post-quantum security proofs"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Christian Majenz"
          note: "The H-coefficient technique is as close as it gets to a universal tool for provable symmetric-key cryptography in idealized models. In this talk, I will first discuss what makes the H-coefficient technique so successful, and discuss why extending it to quantum adversaries seems hard. I will then present a different much more pedestrian approach: hybridizing across an adversary's queries to a keyed oracle (which remains classical/non-quantum in the post-quantum security setting). I will exemplify the technique using Even Mansour, the cipher we developed it for (together with Gorjan Alagic, Chen Bai, and Jonathan Katz). I will show a list of constructions the technique has been applied to, and describe prospects and obstacles to further applications."
    - break:
        time: "10:30 - 11:00"
        type: "Coffee break"
        location: "HHEG07 - Foyer"
    - name: "Late Morning"
      talks:
        - time: "11:00 - 11:40"
          title: "The Next Generation"
          location: "HEEG02 - FAV Hörsaal 1 Helmut Veith"
          speaker: "Mihir Bellare"
          note: "The first part of this talk, which is on the technical side, will critique the current definition of authenticated encryption (AE1 or AEAD), with regard, not to novel or advanced goals, but (perhaps surprisingly) to providing the most basic message privacy. It will then discuss alternatives (AE2, AE3, AE5), ultimately suggesting as a conclusion that a really good definition is still lacking and an open question. The second part of the talk, which is more on the social side, will explore how AI might impact our community."
      others:
        - time: "11:40 - 12:30"
          type: "Work in Groups"
          location: "Seminarraum FAV EG A/B/C; FAV Hörsaal 2/3"
    - break:
        time: "12:30 - 14:00"
        type: "Lunch"
        location: "HHEG07 - Foyer"
    - name: "Early Afternoon"
